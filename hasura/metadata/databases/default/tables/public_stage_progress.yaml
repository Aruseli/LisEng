table:
  name: stage_progress
  schema: public
object_relationships:
  - name: study_stage
    using:
      foreign_key_constraint_on: stage_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns:
        - status
        - completed_at
        - started_at
        - errors_pending
        - tasks_completed
        - tasks_total
        - words_learned
        - average_accuracy
        - created_at
        - updated_at
        - id
        - stage_id
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
