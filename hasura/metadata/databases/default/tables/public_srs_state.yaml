table:
  name: srs_state
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - item_type
        - item_id
        - difficulty
        - stability
        - retrievability
        - state
        - due
        - last_review_at
        - elapsed_days
        - scheduled_days
        - learning_steps
        - reps
        - lapses
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - user_id
        - item_type
        - item_id
        - difficulty
        - stability
        - retrievability
        - state
        - due
        - last_review_at
        - elapsed_days
        - scheduled_days
        - learning_steps
        - reps
        - lapses
update_permissions:
  - role: user
    permission:
      columns:
        - difficulty
        - stability
        - retrievability
        - state
        - due
        - last_review_at
        - elapsed_days
        - scheduled_days
        - learning_steps
        - reps
        - lapses
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
delete_permissions: []
