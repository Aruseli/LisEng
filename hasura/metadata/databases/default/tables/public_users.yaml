insert_permissions:
  - role: user
    permission:
      check:
        id:
          _eq: X-Hasura-User-Id
      columns:
        - current_level
        - daily_goal_minutes
        - email
        - email_verified
        - exam_date
        - id
        - image
        - instruction_language
        - is_admin
        - name
        - reminder_enabled
        - start_date
        - study_place
        - study_time
        - target_level
    comment: ""
select_permissions:
  - role: anonymous
    permission:
      columns:
        - id
        - name
        - image
        - created_at
        - updated_at
        - hasura_role
      filter: {}
  - role: me
    permission:
      columns:
        - id
        - name
        - email
        - email_verified
        - image
        - created_at
        - updated_at
        - is_admin
        - hasura_role
      filter:
        id:
          _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - id
        - name
        - email
        - image
        - created_at
        - updated_at
        - current_level
        - target_level
        - exam_date
        - start_date
        - study_time
        - study_place
        - daily_goal_minutes
        - reminder_enabled
        - instruction_language
        - hasura_role
      filter:
        id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
