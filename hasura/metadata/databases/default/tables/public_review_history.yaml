table:
  name: review_history
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: vocabulary_card
    using:
      foreign_key_constraint_on: card_id
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - was_correct
        - response_time_seconds
        - reviewed_at
        - card_id
        - id
        - user_id
    comment: ""
