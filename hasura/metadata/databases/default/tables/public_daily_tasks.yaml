table:
  name: daily_tasks
  schema: public
object_relationships:
  - name: study_stage
    using:
      foreign_key_constraint_on: stage_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: lesson_snapshots
    using:
      foreign_key_constraint_on:
        column: task_id
        table:
          name: lesson_snapshots
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - ai_enabled
        - status
        - title
        - type
        - task_date
        - duration_minutes
        - ai_context
        - description
        - suggested_prompt
        - completed_at
        - created_at
        - id
        - stage_id
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - ai_context
        - ai_enabled
        - completed_at
        - description
        - duration_minutes
        - status
        - suggested_prompt
        - title
        - type
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
    comment: ""
