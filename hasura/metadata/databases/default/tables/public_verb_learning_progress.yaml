table:
  name: verb_learning_progress
  schema: public
object_relationships:
  - name: irregular_verb
    using:
      foreign_key_constraint_on: verb_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - verb_id
        - next_review_date
        - correct_count
        - incorrect_count
        - last_reviewed_at
        - mastered
        - ease_factor
        - interval_days
        - repetitions
        - created_at
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - verb_id
        - next_review_date
        - correct_count
        - incorrect_count
        - last_reviewed_at
        - mastered
        - ease_factor
        - interval_days
        - repetitions
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - next_review_date
        - correct_count
        - incorrect_count
        - last_reviewed_at
        - mastered
        - ease_factor
        - interval_days
        - repetitions
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
