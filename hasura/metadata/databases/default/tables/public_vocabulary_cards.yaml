table:
  name: vocabulary_cards
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: lesson_vocabulary_extractions
    using:
      foreign_key_constraint_on:
        column: vocabulary_card_id
        table:
          name: lesson_vocabulary_extractions
          schema: public
  - name: review_histories
    using:
      foreign_key_constraint_on:
        column: card_id
        table:
          name: review_history
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - difficulty
        - part_of_speech
        - topic
        - translation
        - word
        - added_date
        - next_review_date
        - correct_count
        - incorrect_count
        - example_sentence
        - created_at
        - last_reviewed_at
        - id
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
