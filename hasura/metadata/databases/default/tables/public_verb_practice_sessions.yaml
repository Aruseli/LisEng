table:
  name: verb_practice_sessions
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - session_date
        - verbs_practiced
        - accuracy
        - duration_minutes
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - session_date
        - verbs_practiced
        - accuracy
        - duration_minutes
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
