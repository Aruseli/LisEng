<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00b894" />
    <title>LisEng — нет соединения</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9fafb;
        color: #111827;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #6b7280;
        margin-bottom: 20px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: #00b894;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 28px;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/logo.svg" alt="LisEng" />
      <h1>Нет соединения</h1>
      <p>
        Проверьте интернет и попробуйте снова. Уже загруженные разделы приложения
        доступны офлайн.
      </p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </div>
  </body>
</html>
